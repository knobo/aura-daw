version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories: ["/aura-engine", "/benches/bulkbench", "/benches/pdsbench", "/benches/ui-probe", "/src-tauri"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sidecars
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github_actions:
        patterns: ["*"]
        update-types: [minor, patch]
