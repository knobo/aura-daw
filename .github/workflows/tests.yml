name: Tests

on:
  pull_request:
  # ALSO on main, and not for its own sake: `Swatinem/rust-cache` can only SAVE
  # a cache on the ref it runs on, and a PR may only restore caches from its own
  # branch or its base. With `pull_request:` alone nothing ever ran on `main`, so
  # there was never a base-branch cache to restore and every PR compiled ~600
  # crates from scratch. Measured on run 32162462316: the cache step finished in
  # 1 s (a miss) and `cargo test` then took 10m28s, of which the tests
  # themselves were 20s.
  push:
    branches: [main]

# A superseded run is wasted runner time, and these runs are expensive (see the
# apt note below).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest, svelte-check, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Type check (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Production build
        run: npm run build

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-24.04
    # Without a cap, a hung apt mirror burns half an hour before anyone notices:
    # on run 32171878639 `apt-get update` stalled for 23.5 minutes and the job
    # was cancelled having never started `cargo test`. Fail fast instead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # `--no-install-recommends`: the recommends of this list are enormous and
      # unrelated — ffmpeg alone drags in `pocketsphinx-en-us`, a speech model
      # that took 161 s to fetch on run 32162462316, plus libvidstab,
      # librubberband and libzimg. Nothing here needs any of them.
      #
      # Retries and timeouts: GitHub runners default to
      # `azure.archive.ubuntu.com`, which returned `Ign:` for every index on run
      # 32171878639 and left apt hanging on the fallback with no deadline of its
      # own. Bounded retries make it fall over to `archive.ubuntu.com` quickly
      # rather than sitting there.
      #
      # ffmpeg is a REAL test dependency, not a leftover:
      # `control::import`'s compressed-format test encodes mp3/flac/ogg/m4a with
      # the ffmpeg CLI. It skips cleanly when ffmpeg is missing, so dropping it
      # would silently cost that coverage rather than fail.
      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev liblilv-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo test
        working-directory: src-tauri
        # --test-threads=1: several midi_out tests spawn real background
        # threads and race under default parallel execution (flaky locally
        # too, independent of CI) — see docs/backlog/ci-hardening.md.
        # --skip: these two need a real ALSA sequencer device
        # (/dev/snd/seq), which this runner doesn't have — see the same doc.
        run: |
          cargo test --locked -- --test-threads=1 \
            --skip select_nonexistent_port_is_graceful_err \
            --skip opening_a_nonexistent_output_port_is_a_graceful_error

  engine:
    name: RT engine (aura-engine)
    runs-on: ubuntu-24.04
    # Its own job, not a step in `rust`: `aura-engine` is a standalone crate
    # with its own lockfile (`src-tauri/Cargo.toml` is frozen — see
    # docs/backlog/jit-engine.md), and it needs NONE of the apt list above.
    # No ALSA, no webkit, no ffmpeg: it is pure Rust plus cranelift, so it
    # starts while `rust` is still installing packages.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aura-engine -> target

      # Clippy is gated here and not on `src-tauri` because this crate was
      # written clean and can stay that way; `approx_constant` is deny-by-
      # default and already caught a pan constant spelled `0.7071` instead of
      # `FRAC_1_SQRT_2`.
      - name: cargo clippy
        working-directory: aura-engine
        run: cargo clippy --locked --all-targets -- -D warnings

      # The equivalence tests are the whole claim of this crate: the JIT kernel
      # renders what `mixer::apply_fader_into` renders. They are worth nothing
      # if nothing runs them, and the crate is outside the workspace the `rust`
      # job builds.
      - name: cargo test
        working-directory: aura-engine
        run: cargo test --locked --all-targets

      # Compiling the benches is not the same as running them (a runner's
      # timings are noise), but a bench that stopped compiling is a real break
      # and this is where it shows up cheaply.
      - name: benches compile
        working-directory: aura-engine
        run: cargo bench --locked --no-run
