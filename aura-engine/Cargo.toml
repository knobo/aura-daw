[package]
name = "aura-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "AURA RT primitives: triple-buffer publish, allocation telemetry, and a Cranelift-fused track-strip kernel"

# STANDALONE crate, deliberately outside the Tauri app. `src-tauri/Cargo.toml`
# is a frozen file, and cranelift is ~40 transitive crates — a dependency
# decision for the owner, not a side effect of a task. Nothing in `src-tauri/`
# depends on this crate yet; see docs/backlog/jit-engine.md.

[lib]
name = "aura_engine"

[dependencies]
# jit.md pinned cranelift 0.110; the newest line this toolchain (1.94.1) accepts is 0.134 — 0.135 needs 1.95. 0.110 predates
# the `cranelift-jit` API this uses). Version deviation is recorded in
# docs/GAP_ANALYSIS.md.
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# jit.md asked for `assert_no_alloc`. Not used: last published 2021, and it
# cannot count allocations, only trip on them. `metrics::AllocCounter` is a
# ~60-line counting global allocator with no dependency — see its module doc.

[[bench]]
name = "kernel"
harness = false

[profile.release]
codegen-units = 1
lto = true

[profile.bench]
codegen-units = 1
lto = true
