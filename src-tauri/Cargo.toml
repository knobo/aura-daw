[package]
name = "aura"
version = "0.1.0"
description = "AURA — Digital Audio Workstation prototype"
authors = ["knobo"]
edition = "2021"
rust-version = "1.77"

# FROZEN FILE — owned by Agent 1 (architecture).
# Agents 2/3/4 must NOT edit this file. If you need another crate,
# report the request; do not add it yourself.

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core & plugins ---
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Op wire form for state blobs (OP_FORMAT_VERSION 2): `serde_json` renders a
# `Vec<u8>` as `[104,101,...]` — ~4x expansion on plugin state that is
# routinely hundreds of KB, written synchronously into journal.ndjson and
# held in every HistoryEntry. base64 is one `#[serde(with = ...)]` away.
base64 = "0.22"

# --- Async runtime / concurrency (engine control plane, sidecar workers) ---
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- Real-time audio ---
cpal = "0.16"          # audio I/O (ALSA/JACK on Linux)
rtrb = "0.3"           # lock-free SPSC ringbuffer (audio thread <-> consumers) — PRIMARY
ringbuf = "0.4"        # alternative lock-free ringbuffer (heap-backed, split producer/consumer)

# --- Audio file I/O ---
hound = "3.5"          # WAV read/write
flacenc = "0.4"        # pure-Rust FLAC encoder (archival/export)
# Universal import decode (wave 1B): MP3/FLAC/OGG-Vorbis/AAC/M4A -> PCM.
# WAV keeps the hound fast path; symphonia only decodes compressed sources.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }

# --- MCP server (embedded, streamable HTTP on 127.0.0.1 — phase 2, src/mcp/) ---
rmcp = { version = "3.1", features = ["server", "transport-streamable-http-server"] }

# --- MIDI (phase 2, src/midi/: .mid import/export + realtime event types) ---
midly = "0.5"

# --- Hardware MIDI input (midi-input-ports slice 1, src/midi_input.rs) ---
# ALSA-seq backend on Linux comes for free (no extra system deps beyond
# what cpal/ALSA already need).
midir = "0.11"

# --- Plugin hosting (phase 3, src/plugins/: CLAP + LV2 — ARCHITECTURE §15) ---
# CLAP: clack (safe host wrapper over clap-sys, CLAP 1.2 ABI, on crates.io
# since 2026-05; pre-1.0 => pinned to the verified 0.1.x line). Verified on
# this machine: PluginEntry::load + factory/descriptor read of
# /usr/lib/clap/*.clap. Zone P1 builds the process/params host on this.
clack-host = "0.1"
clack-extensions = { version = "0.1", features = [
    "clack-host", "params", "audio-ports", "note-ports", "state", "gui", "latency",
] }
# LV2: livi wraps lilv (SYSTEM liblilv-dev REQUIRED — Ubuntu:
# `apt install liblilv-dev`; livi::Features provides urid/options/bufsize +
# atom-sequence MIDI + worker — exactly ZynAddSubFX's required feature set).
# Verified on this machine: Zyn instantiates AND renders audio through
# livi 0.7. LV2 state save/restore needs raw-lilv work on top (zone P4).
livi = "0.7"
walkdir = "2"      # CLAP search-path scanning

# OS clipboard text slot for cross-instance clip copy/paste (Track C). Not
# the Tauri clipboard plugin: adding that would need an edit to
# capabilities/default.json, which is a frozen file. default-features off:
# the crate's `image-data` default drags in the whole `image` decode stack
# (tiff/zune-jpeg/moxcms/...) for a module that only ever touches text.
arboard = { version = "3", default-features = false }

# --- Utilities ---
rand = "0.9"           # MCP session-token generation (crypto-seeded via OsRng/StdRng)
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
byteorder = "1"

[dev-dependencies]
# Property-test gate (round-2 §7 tests 1/3/5): src-tauri/tests/channel_properties.rs.
proptest = "1"

[profile.dev]
# Audio DSP is unusable at opt-level 0; keep deps optimized even in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
strip = true
